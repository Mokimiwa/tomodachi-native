# iOS 工程（xcodegen），App 名、包名、分類取自遊戲檔案（dm/games/<名>/game.tsv，build_ipa.sh 經環境變量給）。tools/build_ipa.sh 先生成 Gen/（宿主源文件鏈接、內嵌的改寫後模塊、iOS 著色器庫、宿主表），再出包。
# iOS project (xcodegen); the app name, bundle ID and category come from the game profile (dm/games/<id>/game.tsv, passed by build_ipa.sh through environment variables). tools/build_ipa.sh generates Gen/ first (host source links, the embedded rewritten modules, iOS shader libraries, host tables), then packages.
name: DmIOS
options:
  bundleIdPrefix: ${DM_BUNDLE_ID}
  deploymentTarget:
    iOS: "26.0"   # 圖形回放走 Metal 4（MTL4CommandQueue 等，iOS 26 起） | Graphics replay uses Metal 4 (MTL4CommandQueue etc., from iOS 26)
configFiles:     # build_ipa.sh 生成：內嵌段鏈接參數 + 從 dm/host/Makefile 取的頭文件路徑與框架 | Generated by build_ipa.sh: embedded-segment link flags + header paths and frameworks taken from dm/host/Makefile
  Release: Gen/dm.xcconfig
  Debug: Gen/dm.xcconfig
targets:
  DmIOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Gen/embed.S
      - path: Gen/dm          # 改寫器的表（*.fixups.tsv / gates / params / cuts / obs）+ 著色器映射表 / c1 清單 / 預熱清單 | Rewriter tables (*.fixups.tsv / gates / params / cuts / obs) + shader map / c1 list / warm-up list
        type: folder
        buildPhase: resources
      - path: Gen/msl         # iOS 版 metallib + 反射 json（DM_MSL_DIR） | iOS metallib + reflection json (DM_MSL_DIR)
        type: folder
        buildPhase: resources
      - path: Gen/duo         # Duo 外殼的圖與聲音（build_ipa.sh 從遊戲檔案取，只在本機） | Duo shell pictures and sound (taken from the game files by build_ipa.sh, local only)
        type: folder
        buildPhase: resources
      - path: Gen/Assets.xcassets   # App 圖標（build_ipa.sh 由遊戲圖標生成；沒有圖標時是空目錄，xcodegen 不論它在不在都會列進工程） | app icon (generated by build_ipa.sh from the game icon; an empty catalog when there is none, since xcodegen lists it in the project whether or not it exists)
      - path: Gen/src         # dm/host/Makefile 編譯命令裡的源文件（tools/gen_build.py 鏈入） | Source files from the compile commands of dm/host/Makefile (linked in by tools/gen_build.py)
      - path: Gen/main/main.c
        compilerFlags: "-Dmain=dm_main"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ${DM_DISPLAY_NAME}   # 基礎版 NSP 裡的遊戲名（build_ipa.sh 設） | the game name in the base NSP (set by build_ipa.sh)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:                     # iOS 27 起必須有啓動畫面，只能是靜態的：純黃（Gen/Assets.xcassets 的 LaunchYellow），接著外殼的開場 Logo | from iOS 27 a launch screen is required and can only be static: plain yellow (LaunchYellow in Gen/Assets.xcassets), followed by the shell's opening logo
          UIColorName: LaunchYellow
        CFBundleLocalizations: [en, zh-Hant, zh-Hans, ja, ko, de, es, fr, it, nl]   # 系統給的字（貼上鍵、鍵盤）跟著系統語言；同遊戲的語言 | system-provided text (the Paste key, the keyboard) follows the system language; the game's languages
        UIFileSharingEnabled: true          # 「文件」App 裡能看到 Documents（log.txt、存檔） | Documents (log.txt, saves) visible in the Files app
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:   # Duo 外殼直拿、橫拿都能用（原先的前端 DM_FRONT=classic 仍只橫向） | the Duo shell works upright and sideways (the previous front end, DM_FRONT=classic, stays landscape only)
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        LSApplicationCategoryType: ${DM_APP_CATEGORY}   # 遊戲檔案 app_category | game profile app_category
        LSSupportsGameMode: true
        GCSupportsControllerUserInteraction: true   # 實體手柄（GameController） | Physical controllers (GameController)
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SceneDelegate
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${DM_BUNDLE_ID}
      PRODUCT_NAME: DmIOS
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      DEVELOPMENT_TEAM: ${DM_TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: $(DM_APPICON)   # 有遊戲圖標時 Gen/dm.xcconfig 設 DM_APPICON = AppIcon；空 = 不設圖標（xcodegen 缺省填 AppIcon，資源目錄裡沒有就出包失敗） | Gen/dm.xcconfig sets DM_APPICON = AppIcon when there is a game icon; empty = no icon (xcodegen's default is AppIcon, which fails the build when the catalog lacks it)
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_BITCODE: NO
      GCC_C_LANGUAGE_STANDARD: gnu11
      OTHER_CFLAGS: $(inherited) -mcpu=apple-a15   # 宿主匯編裡有 LSE 原子指令，缺省基線不認；取 A15 / M2 這一代為底，M2 的 iPad 和更新的機器都能跑（A18 基線的指令舊晶片沒有） | The host assembly contains LSE atomic instructions, which the default baseline does not accept; the A15 / M2 generation is the floor, so M2 iPads and anything newer run it (an A18 baseline uses instructions older chips lack)
      CLANG_ENABLE_OBJC_ARC: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      GCC_WARN_INHIBIT_ALL_WARNINGS: YES
