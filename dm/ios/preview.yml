# Duo 外殼預覽 App（xcodegen）：只有外殼（Sources/Duo*.m）和 Preview/ 裡的入口與輸入口替身，不帶宿主和遊戲，給模擬器看版面。tools/build_preview.sh 先生成 GenPreview/（從遊戲檔案取的圖、靜態圖、資源目錄）再出包。
# Duo shell preview app (xcodegen): only the shell (Sources/Duo*.m) plus the entry point and input stand-ins in Preview/, without the host or the game, for looking at the layout in the simulator. tools/build_preview.sh generates GenPreview/ first (pictures from the game files, the stills, the asset catalog), then builds.
name: DuoPreview
options:
  bundleIdPrefix: ${DM_BUNDLE_ID}
  deploymentTarget:
    iOS: "26.0"
targets:
  DuoPreview:
    type: application
    platform: iOS
    sources:
      - Sources/DuoShell.m
      - Sources/DuoPad.m
      - Sources/DuoTypeCard.m
      - Sources/DuoPanel.m
      - Sources/DuoSave.m
      - Sources/duo_shell.h
      - Preview
      - path: GenPreview/duo    # Logo、波浪、塗鴉、靜態圖、闔上的聲音（都只在本機） | logo, wave, doodles, stills, the closing sound (all local only)
        type: folder
        buildPhase: resources
      - path: GenPreview/Assets.xcassets   # 啓動畫面的黃、App 圖標 | the launch screen's yellow, the app icon
    info:
      path: GenPreview/Info.plist
      properties:
        CFBundleDisplayName: ${DM_DISPLAY_NAME}
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen:                  # iOS 27 起必須有啓動畫面，只能是靜態的：純黃 | from iOS 27 a launch screen is required and can only be static: plain yellow
          UIColorName: LaunchYellow
        CFBundleLocalizations: [en, zh-Hant, zh-Hans, ja, ko, de, es, fr, it, nl]   # 系統給的字（貼上鍵、鍵盤）跟著系統語言；同遊戲的語言 | system-provided text (the Paste key, the keyboard) follows the system language; the game's languages
        UISupportedInterfaceOrientations:   # 外螢幕也能橫拿 | the outer display can be held sideways too
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true          # 同遊戲 App：iPad 上全螢幕 | as in the game app: full screen on iPad
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: DuoPreviewScene
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${DM_BUNDLE_ID}
      PRODUCT_NAME: DuoPreview
      HEADER_SEARCH_PATHS: $(SRCROOT)/../host   # dm_input.h / front.h
      TARGETED_DEVICE_FAMILY: "1,2"   # iPad 也能開，看 iPad 形狀的版面 | runs on iPad too, for checking the iPad-shaped layout
      ASSETCATALOG_COMPILER_APPICON_NAME: $(DM_APPICON)
      CLANG_ENABLE_OBJC_ARC: YES
      GCC_C_LANGUAGE_STANDARD: gnu11
